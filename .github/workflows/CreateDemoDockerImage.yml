name: Build and Push SAM3 Gradio TensorRT Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (e.g., latest, v1.0, 2024-10-24)'
        required: true
        default: 'latest'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (allows for advanced caching and multi-platform builds if needed later)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and push the image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Set the context to the folder containing both the Dockerfile and startup.sh
          context: ./DockerBuildFiles
          file: ./DockerBuildFiles/Dockerfile
          push: true
          provenance: false
          # Formats the tag as username/image_name:input_tag
          tags: ${{ secrets.DOCKER_USERNAME }}/sam3_image_gradio_demo:${{ inputs.image_tag }}
